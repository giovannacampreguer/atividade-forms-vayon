<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seguro Empresarial</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Solicitação de Seguro Empresarial</h1>
    </header>
    <main>
      <form>
        <fieldset>
          <legend>Dados do Segurado</legend>

          <label for="nome">Nome do Segurado:</label>
          <input type="text" id="nome" name="nome" />

          <label for="cpf">CPF:</label>
          <input type="text" id="cpf" name="cpf" onblur="validarCPF()" />
        </fieldset>

        <fieldset>
          <legend>Vigência do Seguro</legend>

          <label for="inicioVigencia">Início de Vigência:</label>
          <input type="date" id="inicioVigencia" name="inicioVigencia" onblur="validarInicioVigencia(); calcularVigencia()" />

          <label for="fimVigencia">Fim de Vigência:</label>
          <input type="date" id="fimVigencia" name="fimVigencia" onblur="calcularVigencia()" />

          <label for="diasVigencia">Dias de Vigência:</label>
          <input type="number" id="diasVigencia" name="diasVigencia" disabled />
        </fieldset>

        <fieldset>
          <legend>Endereço da Empresa</legend>

          <label for="cep">CEP:</label>
          <input type="text" id="cep" name="cep" onblur="consultarCep()" />

          <label for="estado">Estado:</label>
          <input type="text" id="estado" name="estado" />

          <label for="cidade">Cidade:</label>
          <input type="text" id="cidade" name="cidade" />

          <label for="logradouro">Logradouro:</label>
          <input type="text" id="logradouro" name="logradouro" />

          <label for="bairro">Bairro:</label>
          <input type="text" id="bairro" name="bairro" />

          <label for="numero">Número:</label>
          <input type="number" id="numero" name="numero" />

          <label for="complemento">Complemento:</label>
          <input type="text" id="complemento" name="complemento" />
        </fieldset>

        <fieldset>
          <legend>Cobertura do Seguro</legend>

          <label for="cobertura">Tipo de Cobertura:</label>
          <select id="cobertura" name="cobertura" onchange="validarPremio()">
            <option value="">Selecione uma cobertura</option>
            <option value="incendio">Incêndio</option>
            <option value="furtos">Furtos</option>
            <option value="danosEletricos">Danos elétricos</option>
          </select>

          <label for="valorPremio">Valor do Prêmio:</label>
          <input type="number" id="valorPremio" name="valorPremio" onblur="validarPremio()" />
        </fieldset>
        <button type="submit">Enviar Solicitação</button>
      </form>
    </main>
  <script src="script.js"></script>
  </body>
</html>
